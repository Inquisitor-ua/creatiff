
{% load wagtailimages_tags %}

<div class="media-grid-section {{ value.layout }}">

    <div class="media-grid-column">
        {% for img in value.images %}
            {% image img fill-600x400 as rendered_image %}
            <img src="{{ rendered_image.url }}">
        {% endfor %}
    </div>

    <div class="media-grid-column column-text">
        <div class="rich-text-content">
            {{ value.text }}
        </div>
    </div>

</div>
