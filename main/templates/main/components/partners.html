<!-- Example  -->
{% load wagtailimages_tags %}
<section class="partners">
    <div class="container">
        <p>{{ value.title }}</p>
        <div class="partners-wrapper">
            {% for partner in value.partners %}
                {% image partner.partner_logo original as logo %}
                <img src = "{{ logo.url }}" alt="{{ logo.alt }}">
            {% endfor %}
        </div>
    </div>
</section>
